name: Test and Deploy

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Cypress tests against localhost
        run: npx cypress run

      - name: Run Cypress tests against production (money.kelerbit.com)
        env:
          CYPRESS_BASE_URL: https://money.kelerbit.com
        run: npx cypress run

      - name: Run Cypress tests against production (finance.kelerbit.com)
        env:
          CYPRESS_BASE_URL: https://finance.kelerbit.com
        run: npx cypress run

  deploy:
    runs-on: ubuntu-latest
    needs: test  # ← деплой только если тесты прошли
    steps:
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > key.pem
          chmod 400 key.pem
          ssh -o StrictHostKeyChecking=no -i key.pem $EC2_USER@$EC2_HOST << 'EOF'
            cd ~/Financial_future
            git pull origin main
            npm install --production
            pm2 restart financial-future || pm2 start server.js --name "financial-future"
          EOF