server {
    listen 80;
    server_name money.kelerbit.com;

    # Основное приложение
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # BMI Калькулятор
    location /bmi/ {
        # Слэш в конце http://localhost:8081/ ОБЯЗАТЕЛЕН. 
        # Он говорит Nginx отрезать "/bmi/" из пути перед отправкой в контейнер.
        proxy_pass http://localhost:8081/; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Исправляет проблему с перенаправлениями (Redirect), если приложение их шлет
        proxy_redirect off;
    }
}