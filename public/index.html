<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Future Projections</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Financial Future</h1>
    </header>
    
    <main>
        <div class="calculator-container">
            <form id="projection-form">
                
                <section class="input-group">
                    <h2>Personal Data & Income</h2>
                    
                    <label for="name">Your name:</label>
                    <input type="text" id="name" required>

                    <label for="currentAge">Your current age:</label>
                    <input type="number" id="currentAge" min="18" value="30" required>

                    <label for="activeMonthly">Active earnings per month:</label>
                    <input type="number" id="activeMonthly" min="0" value="5000" required>

                    <label for="additionalYearly">Additional active earnings per year:</label>
                    <input type="number" id="additionalYearly" min="0" value="0" required>
                    
                    <div class="toggle-row">
                        <label for="incomeIncreasement">Income increasement (between 35 and 45)</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="incomeIncreasement" name="incomeIncreasement">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <label for="currentAssets">Total worth of current assets:</label>
                    <input type="number" id="currentAssets" min="0" value="10000" required>
                </section>
                <br>
                <section class="input-group">
                    <h2>Spendings & Family</h2>
                    
                    <label for="regularMonthly">Regular spendings per month:</label>
                    <input type="number" id="regularMonthly" min="0" value="3000" required>
                    
                    <label for="additionalYearlySpending">Additional spendings per year:</label>
                    <input type="number" id="additionalYearlySpending" min="0" value="0" required>

                    <label for="childrenNumber">Number of children:</label>
                    <input type="number" id="childrenNumber" min="0" value="0" required>
                    
                    <div class="toggle-row">
                        <label for="privateSchool">Private school/kindergarden/university?</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="privateSchool" name="privateSchool">
                            <span class="slider"></span>
                        </label>
                    </div>
                </section>

                <section class="input-group">
                    <h2>Projection & Investments</h2>
                    
                    <div class="toggle-row">
                        <label for="moreTraveling">More traveling</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="moreTraveling" name="moreTraveling">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="toggle-row">
                        <label for="healthProblems">More health problems (after 40 years)</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="healthProblems" name="healthProblems">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="toggle-row">
                        <label for="parentsHelp">Help for parents (after 40 years)</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="parentsHelp" name="parentsHelp">
                            <span class="slider"></span>
                        </label>
                    </div>
                    
                    <label for="projectionYears">Investments projection period (in years):</label>
                    <input type="number" id="projectionYears" min="1" max="60" value="20" required>

                    <label for="annualReturn">Annual return rate of the investments (%):</label>
                    <input type="number" id="annualReturn" min="0" step="0.1" value="8" required>
                </section>
                
                <button type="submit" id="calculate-btn">Calculate Future</button>
                <p id="server-message" style="text-align: center; color: red;"></p>
            </form>

            <section id="results" class="results-container" style="display: none;">
                <h2>Projected Net Worth</h2>
                <div class="summary">
                    <div class="summary-item">
                        <h3>Investing Scenario</h3>
                        <p id="investing-result" class="result-value"></p>
                    </div>
                    <div class="summary-item">
                        <h3>Saving-Only Scenario</h3>
                        <p id="saving-result" class="result-value"></p>
                    </div>
                </div>
                <div id="chart-container">
                    <canvas id="projectionChart"></canvas>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; Financial Future</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
